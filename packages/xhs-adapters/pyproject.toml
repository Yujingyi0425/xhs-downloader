[project]
name = "xhs-adapters"
version = "3.0.0"
description = "xhs-downloader 网络、文件与持久化适配器"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "filelock>=3.20.3",
    "httpx[http2,socks]>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.0.0",
    "playwright>=1.61.0",
    "pydantic-settings>=2.12.0",
    "pywin32>=311; sys_platform == 'win32'",
    "pyyaml>=6.0.0",
    "tzdata>=2026.1; sys_platform == 'win32'",
    "xhs-core",
]

[project.optional-dependencies]
video = [
    "av>=18.1.0",
    "faster-whisper>=1.2.1",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "pillow-heif>=1.7.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_adapters"]

[tool.uv.sources]
xhs-core = { workspace = true }
